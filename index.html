<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox practice</title>
    <link rel="stylesheet" type="text/css" href="stylesheet.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<section class="container">
    <h1>Multiplication Table Project</h1>
    <h3>Create your own multiplication table using flexbox!</h3>

    <div class="generate-box">
        <div class="inputs">
            <label for="flexRows">Rows:
                <input id="flexRows" type="number" value="10" placeholder="How many rows?"/>
            </label>

            <label for="flexCols">Columns:
                <input id="flexCols" type="number" value="10" placeholder="How many cols?"/>
            </label>

            <label for="flexHighlight">Highlight:
                <input id="flexHighlight" type="number" placeholder="Highlight row and col?"/>
            </label>
        </div>



        <button id="generate" onclick="createFlexTable(getInputValueAsNumber('flexRows'),getInputValueAsNumber('flexCols'), getInputValueAsNumber('flexHighlight'))">Generate TABLE!</button>
    </div>

    <div id="output"></div>
</section>

</body>
<script src="javascript.js"></script>
</html>
